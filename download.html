<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaxPlay - Official Download</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow: hidden;
        }

        /* Background Design Elements */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
        }
        .shape1 {
            width: 400px;
            height: 400px;
            background: rgba(233, 69, 96, 0.3);
            top: -100px;
            left: -100px;
        }
        .shape2 {
            width: 300px;
            height: 300px;
            background: rgba(15, 52, 96, 0.5);
            bottom: -50px;
            right: -50px;
        }

        /* Glassmorphism Card */
        .download-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            animation: fadeIn 0.8s ease-out;
        }

        /* Logo Styling */
        .logo {
            width: 120px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        }

        /* Typography */
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff, #e94560);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: #a0a0a0;
            margin-bottom: 30px;
        }

        /* App Details */
        .app-details {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
        }

        .badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Download Button */
        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #e94560, #c81d3e);
            color: #fff;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(233, 69, 96, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(233, 69, 96, 0.5);
        }

        .download-btn:active {
            transform: translateY(1px);
        }

        .download-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Security Text */
        .security-text {
            margin-top: 20px;
            font-size: 11px;
            color: #7a7a7a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        /* Simple Fade Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .download-container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 24px;
            }
            .download-btn {
                padding: 14px 20px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Background Elements -->
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>

    <!-- Main Card -->
    <div class="download-container">
        <!-- Logo -->
        <img src="https://i.ibb.co/G4bcVYwY/Picsart-26-07-03-00-56-20-216-removebg-preview.png" alt="MaxPlay Logo" class="logo">
        
        <!-- Titles -->
        <h1>MaxPlay</h1>
        <p class="subtitle">The Ultimate Entertainment App</p>
        
        <!-- App Info Badges -->
        <div class="app-details">
            <span class="badge">Android</span>
            <span class="badge">Latest Version</span>
            <span class="badge">Free</span>
        </div>
        
        <!-- Direct MediaFire Download Link -->
        <a href="https://www.mediafire.com/file/ohwic5pxb39b83m/base.apk/file" target="_blank" rel="noopener noreferrer" class="download-btn">
            <!-- SVG Download Icon -->
            <svg class="download-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
            </svg>
            Download APK
        </a>

        <!-- Security Badge -->
        <div class="security-text">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            100% Safe & Secure Download
        </div>
    </div>

</body>
</html>
